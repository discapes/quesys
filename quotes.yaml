quotes:
  - quote: "My planet, Arrakis, is so beautiful when the sun is low. Rolling over the sands, you can see spice in the air."
    speaker: "Chani"

  - quote: "The outsiders race against time to avoid the heat of the day."
    speaker: "Chani"

  - quote: "The outsiders ravage our land in front of our eyes. Their cruelty to my people is all I've known. What's to become of our world, Paul?"
    speaker: "Chani"
    context: "trailer"

  - quote: "Why did the Emperor choose this path? And who will our next oppressors be?"
    speaker: "Chani"

  - quote: "Why do we have to go through all this when it's already been decided?"
    speaker: "Paul Atreides"

  - quote: "Without spice, interstellar travel is impossible."
    speaker: ""

  - quote: "We are House Atreides. There is no call we do not answer. There is no faith that we betray. The Emperor asks us to bring peace to Arrakis. House Atreides accepts!"
    speaker: "Duke Leto Atreides"

  - quote: "Dreams make good stories, but everything important happens when we're awake."
    speaker: "Duncan Idaho"

  - quote: "I need you by my side."
    speaker: "Duke Leto Atreides"

  - quote: "Here on Caladan, we've ruled by air power and sea power. On Arrakis, we need to cultivate desert power."
    speaker: "Duke Leto Atreides"

  - quote: 'Your grandfather said, "A great man doesn''t seek to lead. He''s called to it. And he answers." And if your answer is no, you''ll still be the only thing I ever needed you to be, my son. I found my own way to it. Maybe you''ll find yours.'
    speaker: "Duke Leto Atreides"

  - quote: "You fight when the necessity arises, no matter the mood. Now fight!"
    speaker: "Gurney Halleck"

  - quote: "The Emperor is a jealous man. A dangerous, jealous man."
    speaker: "Baron Vladimir Harkonnen"

  - quote: "A path has been laid. Let's hope he doesn't squander it."
    speaker: "Reverend Mother Gaius Helen Mohiam"

  - quote: "Defiance in the eyes, like his father."
    speaker: "Reverend Mother Gaius Helen Mohiam"

  - quote: "Goodbye, young human. I hope you live."
    speaker: "Reverend Mother Gaius Helen Mohiam"

  - quote: "He wields our power. He had to be tested to the limits."
    speaker: "Reverend Mother Gaius Helen Mohiam"

  - quote: "You've proven you can rule yourself. Now you must learn to rule others, something none of your ancestors learnt."
    speaker: "Reverend Mother Gaius Helen Mohiam"
    context: "trailer"

  - quote: "A mind powerful enough to bridge space and time."
    speaker: "Lady Jessica Atreides"

  - quote: "Let's get you out of the sun. The heat can kill in this place."
    speaker: "Thufir Hawat"

  - quote: "They see what they've been told to see."
    speaker: "Paul Atreides"

  - quote: "If you mean to harm me, I must warn you, whatever you're hiding, it won't be enough."
    speaker: "Lady Jessica Atreides"

  - quote: "Allow them the dignity of exile."
    speaker: "Reverend Mother Gaius Helen Mohiam"

  - quote: "There's something happening to me. There's something awakening in my mind. I can't control it."
    speaker: "Paul Atreides"
    context: "trailer"

  - quote: "Arrakis is Arrakis, and the desert takes the weak. My desert. My Arrakis. My Dune."
    speaker: "Baron Vladimir Harkonnen"

  - quote: "You will never be hunted while I govern here."
    speaker: "Duke Leto Atreides"

  - quote: "Come and see the spice sands on which your livelihood depends."
    speaker: "Dr. Liet Kynes"

  - quote: "A shield is a death sentence in the desert."
    speaker: "Dr. Liet Kynes"

  - quote: "I recognize your footsteps, old man."
    speaker: "Paul Atreides"

  - quote: "It wasn't an allergic reaction. I had a vision. My eyes were wide open."
    speaker: "Paul Atreides"

  - quote: "I thought we'd have more time."
    speaker: "Duke Leto Atreides"

  - quote: "This is an extermination. They're picking my family off one by one."
    speaker: "Paul Atreides"
    context: "trailer"

  - quote: "I respect the personal dignity of any man that respects mine."
    speaker: "Duke Leto Atreides"

  - quote: "I must not fear. Fear is the mind-killer. Fear is the little death that brings obliteration. I will face my fear and I will permit it to pass over me and through me. And when it has gone past, I will turn the inner eye to see its path. Where the fear has gone there will be nothing. Only I will remain."
    speaker: "Lady Jessica Atreides"

  - quote: "One day, a legend will be born. All of civilization depends on it."
    speaker: "Reverend Mother Gaius Helen Mohiam"
    context: "trailer"

  - quote: "There's a crusade coming."
    speaker: "Paul Atreides"
    context: "trailer"

  - quote: "The Duke's son, he sees too much."
    speaker: "Piter de Vries"
    context: "promotional trailer"

  - quote: "I said I'd set her free. That you could join her. So, join her."
    speaker: "Baron Vladimir Harkonnen"

  - quote: "The mystery of life isn't a problem to solve, but a reality to experience. A process that cannot be understood by stopping it. We must move with the flow of the process. We must join it. We must flow with it."
    speaker: "Jamis"

  - quote: "What wealth can you offer beyond the water in your flesh?"
    speaker: "Stilgar"

  - quote: "If anything happens, will you protect our son?"
    speaker: "Duke Leto Atreides"

  - quote: "Let's fight like demons!"
    speaker: "Duncan Idaho"
    context: "trailer"

  - quote: "My father came, not for spice, not for the riches, but for the strength of your people. My road leads into the desert. I can see it. If you'll have us, we will come."
    speaker: "Paul Atreides"

  - quote: "Here I am, here I remain."
    speaker: "Duke Leto Atreides"

  - quote: "You have more than one birthright, boy."
    speaker: "Reverend Mother Gaius Helen Mohiam"

  - quote: "You're one of us now. A life for a life."
    speaker: "Stilgar"

  - quote: "You talk like a leader, but the strongest leads. She bested you. I invoke the amtal."
    speaker: "Jamis"

  - quote: "This is only the beginning."
    speaker: "Chani"

  - quote: "Dreams are messages from the deep."
    speaker: "Unnamed Sardaukar priest"

  - quote: "I serve only one master. His name is Shai-Hulud."
    speaker: "Dr. Liet Kynes"

  - quote: "Bless the Maker and His water. Bless the coming and going of Him. May His passage cleanse the world. And keep the world for His people."
    speaker: "Dr. Liet Kynes"

  - quote: "Arrakis is a death trap."
    speaker: "Reverend Mother Gaius Helen Mohiam"
    context: "trailer"

  - quote: 'By the grace of Shaddam IV of House Corrino, ascendant to the Golden Lion Throne of Padishah Emperor of the Known Universe, I stand before you as Herald of the Change. We are witnessed by members of the Imperial Court, representatives of the Spacing Guild and a sister of the Bene Gesserit. The Emperor has spoken. "House Atreides shall immediately take control of Arrakis and serve as its steward." Do you accept?'
    speaker: "Herald of the Change"

  - quote: "Get off me! You did this to me! You Bene Gesserit made me a freak!"
    speaker: "Paul Atreides"

  - quote: "There's no finer fighter in the Imperium. They fight like demons."
    speaker: "Duncan Idaho"

  - quote: "When you have lived with prophecy for so long, the moment of revelation is a shock."
    speaker: "Shadout Mapes"

  - quote: "Desert power."
    speaker: "Paul Atreides"
    also_spoken_by: "Duke Leto Atreides"

  - quote: "How dare you use the Voice on me?"
    speaker: "Paul Atreides"

  - quote: "What says the Judge of the Change?"
    speaker: "Lady Jessica Atreides"

  - quote: "They say you're the Mahdi, but you look like a little boy."
    speaker: "Chani"

  - quote: "Paul Atreides. You are your father's son. You are my son. You are the Duke Paul Atreides. You know who you are. You know who you are."
    speaker: "Lady Jessica Atreides"

  - quote: "You need to drink. It's recycled water from the tent. Sweat and tears."
    speaker: "Paul Atreides"

  - quote: "Paul."
    speaker: "Chani"

  - quote: "You have a wonderful kitchen, cousin."
    speaker: "Baron Vladimir Harkonnen"

  - quote: "There's no yielding under the amtal rule. Only death is the test of it."
    speaker: "Stilgar"

  - quote: "Do you yield?"
    speaker: "Paul Atreides"

  - quote: "I recognize you."
    speaker: "Stilgar"

  - quote: "You have much to learn."
    speaker: "Jamis"

  - quote: "My lungs taste the air of Time, blown past falling sand."
    speaker: "Gurney Halleck"

  - quote: "When is a gift not a gift?"
    speaker: "Baron Vladimir Harkonnen"

  - quote: "I am commanded to say nothing, to see nothing."
    speaker: "Dr. Liet Kynes"
